# A router, and a Let's Encrypt certificate, for PILER_HOSTNAME and each of
# TENANT_HOSTNAMES (comma separated), both in .env. Don't edit this file:
# change .env, then run docker compose up -d.

http:
  routers:
{{- $hosts := splitList "," (printf "%s,%s" (env "PILER_HOSTNAME") (env "TENANT_HOSTNAMES")) }}
{{- range $i, $host := $hosts }}
{{- if trim $host }}
    piler-ui-{{ $i }}:
      rule: "Host(`{{ trim $host }}`)"
      entryPoints:
        - websecure
      service: piler-ui
      tls:
        certResolver: letsencrypt
{{- end }}
{{- end }}

  services:
    piler-ui:
      loadBalancer:
        servers:
          - url: "http://piler-ui:3000"
