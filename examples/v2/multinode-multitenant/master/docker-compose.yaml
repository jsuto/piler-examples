# Master node: the web UI and REST API of every tenant. It stores no email,
# it queries the workers. The settings are in .env and piler.env.

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - piler
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *defaults
    image: mariadb:12.0.2
    cap_drop:
      - ALL
    cap_add:
      - dac_override
      - setuid
      - setgid
    environment:
      - MYSQL_DATABASE=aaaaa
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - piler_db:/var/lib/mysql
    healthcheck:
      # Succeeds when the server answers, without a password ("Access denied"
      # is an answer too). Over TCP: the server of the first start, which
      # creates the database, doesn't listen on the network.
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 5
    ports:
      # The workers copy the rules of the tenants from here
      - "${PRIVATE_IP}:3306:3306"

  manticore:
    <<: *defaults
    image: manticoresearch/manticore:29.9.0
    volumes:
      - ./manticore.conf:/etc/manticoresearch/manticore.conf
      - piler_manticore:/var/lib/manticore
    ports:
      # The workers copy the categories of the tenants from here (read-only)
      - "${PRIVATE_IP}:9307:9307"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9306 -e 'SHOW STATUS' >/dev/null"]
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 5

  cache:
    <<: *defaults
    image: valkey/valkey:9-alpine
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: "10s"
      timeout: "5s"
      retries: 5

  # Creates the databases and the distributed indexes of new tenants
  piler:
    <<: *defaults
    image: sutoj/piler-ee:${PILER_VERSION}
    init: true
    environment:
      - NODE_TYPE=MASTER
      - MULTINODES=1
      - PILER_HOSTNAME=${PILER_HOSTNAME}
      - MYSQL_HOSTNAME=mysql
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_HOST=mysql:3306
      - CACHE_HOSTNAME=cache
      - MANTICORE_HOST=manticore
      - MANTICORE_WORKERS=${MANTICORE_WORKERS}
      - ENCRYPTED_SQL=0
      - PILER_ENV_FILE=/var/piler/.env
    volumes:
      - piler_tenant:/var/piler/tenant
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./piler.key:/etc/piler/piler.key:ro
      - ./piler.env:/var/piler/.env:ro
    healthcheck:
      # The entrypoint starts the daemon after the database is there and the
      # default tenant is created
      test: ["CMD", "pidof", "piler"]
      interval: "10s"
      timeout: "5s"
      start_period: "120s"
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_healthy
      cache:
        condition: service_healthy

  piler-ui:
    <<: *defaults
    image: sutoj/piler-ui:${PILER_VERSION}
    init: true
    user: "2001:1001"
    environment:
      - XDG_CACHE_HOME=/tmp/.cache
      - WORKERS=${WORKERS}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - IMAP_ENCRYPT_KEY=${IMAP_ENCRYPT_KEY}
    volumes:
      # New tenants are written here, the piler container creates them
      - piler_tenant:/var/piler/tenant
      - piler_export:/var/piler/export
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./piler.key:/etc/piler/piler.key:ro
      - ./piler.env:/app/.env:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 4096
    healthcheck:
      # 503 when the database, Manticore or Valkey doesn't answer. Not the
      # workers: a worker that's down doesn't stop the master
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: "10s"
      timeout: "5s"
      start_period: "30s"
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_healthy
      cache:
        condition: service_healthy
      piler:
        condition: service_healthy

  traefik:
    <<: *defaults
    image: traefik:v3.7.11
    # A fixed address: piler-ui trusts the X-Forwarded-For of this one only
    # (TRUSTED_PROXIES in piler.env)
    networks:
      piler:
        ipv4_address: 172.31.251.10
    command:
      # For the healthcheck, on port 8080 inside the container only
      - --ping=true
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "443:443"
    volumes:
      - piler_traefik:/letsencrypt
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: "10s"
      timeout: "5s"
      retries: 3

volumes:
  piler_db:
    external: true
  piler_manticore:
    external: true
  piler_tenant:
    external: true
  piler_traefik:
    external: true
  piler_export: {}

networks:
  piler:
    name: piler-master
    # A fixed subnet for the fixed address of traefik. If it overlaps a
    # network of the host, change it, traefik's address and TRUSTED_PROXIES
    ipam:
      config:
        - subnet: 172.31.251.0/24
