# Worker node: receives the emails (piler-smtp), archives them (piler) to
# S3, indexes them in its own MariaDB and Manticore, and answers the
# master's queries (piler-ui). The settings are in .env and piler.env.

x-defaults: &defaults
  restart: unless-stopped
  networks:
    - piler
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-s3: &s3
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_USE_SSL: ${S3_USE_SSL}
  S3_BUCKET_PREFIX: ${S3_BUCKET_PREFIX}

services:
  mysql:
    <<: *defaults
    image: mariadb:12.0.2
    cap_drop:
      - ALL
    cap_add:
      - dac_override
      - setuid
      - setgid
    environment:
      - MYSQL_DATABASE=aaaaa
      - MYSQL_USER=piler
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - piler_db:/var/lib/mysql
    healthcheck:
      # Succeeds when the server answers, without a password ("Access denied"
      # is an answer too). Over TCP: the server of the first start, which
      # creates the database, doesn't listen on the network.
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 5

  manticore:
    <<: *defaults
    image: manticoresearch/manticore:29.9.0
    volumes:
      - ./manticore.conf:/etc/manticoresearch/manticore.conf
      - piler_manticore:/var/lib/manticore
    ports:
      # The distributed indexes of the master query this port
      - "${PRIVATE_IP}:9312:9312"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9306 -e 'SHOW STATUS' >/dev/null"]
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 5

  cache:
    <<: *defaults
    image: valkey/valkey:9-alpine
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    command: valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: "10s"
      timeout: "5s"
      retries: 5

  # Extracts the text of the attachments for the index
  tika:
    <<: *defaults
    image: apache/tika:3.2.3.0
    cap_drop:
      - ALL
    healthcheck:
      # The image has no curl or wget
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9998"]
      interval: "10s"
      timeout: "5s"
      start_period: "60s"
      retries: 5

  piler-smtp:
    <<: *defaults
    image: sutoj/piler-smtp:${PILER_SMTP_VERSION}
    init: true
    environment:
      - LOG_LEVEL=INFO
    ports:
      - "25:25"
    volumes:
      - piler_tmp:/var/piler/tmp
      # It accepts the emails of a tenant once its store directory exists
      - piler_store:/var/piler/store:ro
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./license.pub:/etc/piler/license.pub:ro
      - ./piler.conf:/etc/piler/piler.conf:ro
    healthcheck:
      test: curl -s smtp://localhost/
      interval: "10s"
      timeout: "3s"
      start_period: "15s"
      retries: 3

  piler:
    <<: *defaults
    image: sutoj/piler-ee:${PILER_VERSION}
    init: true
    hostname: ${WORKER_NAME}
    environment:
      NODE_TYPE: WORKER
      MULTINODES: 1
      PILER_HOSTNAME: ${WORKER_NAME}
      MASTER_NODE: ${MASTER_HOST}
      MASTER_MYSQL_NODE: ${MASTER_HOST}
      MASTER_MANTICORE_NODE: ${MASTER_HOST}
      MYSQL_HOSTNAME: mysql
      MYSQL_USER: piler
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_HOST: mysql:3306
      CACHE_HOSTNAME: cache
      MANTICORE_HOST: manticore
      ENCRYPTED_SQL: 0
      PILER_ENV_FILE: /var/piler/.env
      <<: *s3
    volumes:
      - piler_tmp:/var/piler/tmp
      - piler_store:/var/piler/store
      - piler_astore:/var/piler/astore
      - piler_s3:/var/piler/s3
      - piler_tenant:/var/piler/tenant
      # The emails piler and s3uploader couldn't archive or upload, kept
      # over container recreates
      - piler_error:/var/piler/error
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./piler.key:/etc/piler/piler.key:ro
      - ./piler.env:/var/piler/.env:ro
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      # The entrypoint starts the daemon after the database is there and the
      # default tenant is created
      test: ["CMD", "pidof", "piler"]
      interval: "10s"
      timeout: "5s"
      start_period: "120s"
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_healthy
      cache:
        condition: service_healthy
      tika:
        condition: service_started

  # Uploads the emails the piler daemon stages in /var/piler/s3
  s3uploader:
    <<: *defaults
    image: sutoj/s3uploader:${PILER_VERSION}
    init: true
    user: "1001:1001"
    environment:
      S3_WORKERS: 5
      <<: *s3
    volumes:
      - piler_s3:/var/piler/s3
      - piler_error:/var/piler/error
      - ./piler.env:/var/piler/.env:ro
    healthcheck:
      test: ["CMD", "pidof", "s3uploader"]
      interval: "10s"
      timeout: "5s"
      retries: 3

  # The master queries this piler-ui for the search results and emails of
  # this worker
  piler-ui:
    <<: *defaults
    image: sutoj/piler-ui:${PILER_VERSION}
    init: true
    user: "2001:1001"
    environment:
      XDG_CACHE_HOME: /tmp/.cache
      ALLOWED_CIDRS: ${ALLOWED_CIDRS}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IMAP_ENCRYPT_KEY: ${IMAP_ENCRYPT_KEY}
      <<: *s3
    volumes:
      # New tenants are written here, the piler container creates them
      - piler_tenant:/var/piler/tenant
      - piler_store:/var/piler/store:ro
      - piler_astore:/var/piler/astore:ro
      - piler_export:/var/piler/export
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./piler.key:/etc/piler/piler.key:ro
      - ./piler.env:/app/.env:ro
    ports:
      - "${PRIVATE_IP}:3000:3000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc: 4096
    healthcheck:
      # 503 when the database, Manticore or Valkey doesn't answer
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: "10s"
      timeout: "5s"
      start_period: "30s"
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_healthy
      cache:
        condition: service_healthy
      piler:
        condition: service_healthy

  # Smart insights, phishing detection and semantic search (optional)
  scanner:
    <<: *defaults
    image: sutoj/scanner:${SCANNER_VERSION}
    init: true
    user: "2001:1001"
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      <<: *s3
    volumes:
      - piler_store:/var/piler/store:ro
      - piler_astore:/var/piler/astore:ro
      - ./license.jwt:/etc/piler/license.jwt:ro
      - ./piler.key:/etc/piler/piler.key:ro
      - ./piler.env:/app/.env:ro
    # Its image has a healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      manticore:
        condition: service_healthy

  # S3 storage on this host (optional, `docker compose --profile s3 up -d`):
  # for a test, or when this worker keeps its emails in its own storage.
  # Set S3_ENDPOINT=rustfs:9000, S3_USE_SSL=false and the access key in .env
  rustfs:
    <<: *defaults
    image: rustfs/rustfs:${RUSTFS_VERSION}
    profiles:
      - s3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - piler_rustfs:/data
    ports:
      # For creating the buckets, on the private network only
      - "${PRIVATE_IP}:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: "10s"
      timeout: "5s"
      start_period: "30s"
      retries: 3

volumes:
  piler_db:
    external: true
  piler_manticore:
    external: true
  piler_tmp:
    external: true
  piler_store:
    external: true
  piler_astore:
    external: true
  piler_s3:
    external: true
  piler_tenant:
    external: true
  piler_error:
    external: true
  piler_export: {}
  piler_rustfs:
    external: true

networks:
  piler:
    name: piler-worker
